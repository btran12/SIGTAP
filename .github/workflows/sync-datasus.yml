name: Sync DATASUS TUP

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC (5 AM BRT)
  workflow_dispatch:  # Allows manual execution

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Install lftp
        run: sudo apt-get install -y lftp
        
      - name: Download TabelaUnificada ZIPs (last 6)
        run: |
          mkdir -p tabelas
          cd tabelas
          
          lftp -c "
          set ftp:ssl-allow no;
          open ftp://anonymous:@ftp2.datasus.gov.br;
          cd /pub/sistemas/tup/downloads;
          cls -1 TabelaUnificada_*.zip > /tmp/files.txt
          "
          
          tail -n 6 /tmp/files.txt > /tmp/last6.txt
          
          echo "📥 Files to download:"
          cat /tmp/last6.txt
          
          while IFS= read -r arquivo; do
            if [ ! -f "$arquivo" ]; then
              echo "⬇️  Downloading: $arquivo"
              lftp -c "
              set ftp:ssl-allow no;
              open ftp://anonymous:@ftp2.datasus.gov.br;
              cd /pub/sistemas/tup/downloads;
              get -c \"$arquivo\"
              "
            else
              echo "✅ Already exists: $arquivo"
            fi
          done < /tmp/last6.txt
          
      - name: Download all technical notes
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          open ftp://anonymous:@ftp2.datasus.gov.br;
          mirror -v --only-newer --parallel=3 /pub/sistemas/tup/downloads/notastecnicas ./notastecnicas
          "
      
      - name: Clean old files
        run: |
          cd tabelas
          for arquivo in TabelaUnificada_*.zip; do
            if [ -f "$arquivo" ] && ! grep -q "$arquivo" /tmp/last6.txt; then
              echo "🗑️  Removing old file: $arquivo"
              rm "$arquivo"
            fi
          done
      
      - name: Generate file statistics
        run: |
          echo "TOTAL_SIZE=$(du -sh tabelas | cut -f1)" >> $GITHUB_ENV
          echo "NOTAS_COUNT=$(find notastecnicas -type f | wc -l)" >> $GITHUB_ENV
          echo "TABELAS_COUNT=$(ls -1 tabelas/*.zip 2>/dev/null | wc -l)" >> $GITHUB_ENV
          echo "LAST_UPDATE=$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M:%S BRT')" >> $GITHUB_ENV
      
      - name: Generate README with file list
        run: |
          cat > README.md << EOF
          # 📊 DATASUS - SIGTAP Unified Table
          
          [![Sync Status](https://github.com/${{ github.repository }}/actions/workflows/sync-datasus.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/sync-datasus.yml)
          [![Last Update](https://img.shields.io/badge/last%20update-$(date -u '+%Y--%m--%d')-blue)](https://github.com/${{ github.repository }}/commits/main)
          
          Automated repository mirroring the files of the **Unified Table of the Procedures Table Management System (SIGTAP)** from DATASUS.
          
          ## 📦 Unified Tables (Last 6 Months)
          
          > **Total:** $TABELAS_COUNT files | **Size:** $TOTAL_SIZE
          
          | File | Period | Size | Download |
          |------|--------|------|----------|
          EOF
          
          cd tabelas
          for arquivo in $(ls -r TabelaUnificada_*.zip 2>/dev/null); do
            # Extract year/month from the filename (e.g. TabelaUnificada_202601_v2601221740.zip)
            periodo=$(echo "$arquivo" | grep -oP '(?<=TabelaUnificada_)\d{6}')
            ano=${periodo:0:4}
            mes=${periodo:4:2}
            
            # Format month
            case $mes in
              01) mes_nome="January" ;;
              02) mes_nome="February" ;;
              03) mes_nome="March" ;;
              04) mes_nome="April" ;;
              05) mes_nome="May" ;;
              06) mes_nome="June" ;;
              07) mes_nome="July" ;;
              08) mes_nome="August" ;;
              09) mes_nome="September" ;;
              10) mes_nome="October" ;;
              11) mes_nome="November" ;;
              12) mes_nome="December" ;;
            esac
            
            tamanho=$(ls -lh "$arquivo" | awk '{print $5}')
            url="https://github.com/${{ github.repository }}/raw/main/tabelas/$arquivo"
            
            echo "| \`$arquivo\` | $mes_nome/$ano | $tamanho | [⬇️ Download]($url) |" >> ../README.md
          done
          cd ..
          
          cat >> README.md << 'EOF'
          
          ## 🔍 Monthly Diff Reports
          
          Download the latest tables and browse month-to-month comparison reports from [`index.html`](./index.html). Date-related changes are ignored.
          
          EOF
          
          cat >> README.md << EOF
          
          ## 📄 Technical Notes
          
          > **Total:** $NOTAS_COUNT documents
          
          All available technical notes are in the [\`notastecnicas/\`](./notastecnicas/) folder
          
          ### Latest Notes
          
          EOF
          
          find notastecnicas -type f -name "*.pdf" | sort -r | head -5 | while read -r nota; do
            nome=$(basename "$nota")
            url="https://github.com/${{ github.repository }}/blob/main/$nota"
            echo "- [\`$nome\`]($url)" >> README.md
          done
          
          cat >> README.md << 'EOF'
          
          ## 📖 About SIGTAP
          
          The SIGTAP Unified Table contains:
          - Medical and dental procedures
          - Medications and OPM (Orthoses, Prostheses and Special Materials)
          - SUS reimbursement values
          - ICD-10 and compatibility mappings
          - Authorizations and classifications
          
          ## 🔄 Automatic Update
          
          This repository is updated **daily at 5 AM (Brasília time)** via GitHub Actions.
          
          **Official source:** [DATASUS FTP](ftp://ftp2.datasus.gov.br/pub/sistemas/tup/downloads/)
          
          ## 💻 How to Use
          
          ### Download via wget/curl
          ```bash
          # Latest available table
          wget https://github.com/${{ github.repository }}/raw/main/tabelas/TabelaUnificada_202601_v2601221740.zip
          ```
          
          ### Clone the repository
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd SIGTAP/tabelas
          ```
          
          ### GitHub API (programmatic)
          ```bash
          curl -s https://api.github.com/repos/${{ github.repository }}/contents/tabelas | jq -r '.[].download_url'
          ```
          
          ## 📊 File Structure
          
          ```
          SIGTAP/
          ├── tabelas/                    # Unified tables (6 most recent)
          │   └── TabelaUnificada_*.zip
          └── notastecnicas/              # Official technical documentation
              └── *.pdf
          ```
          
          ## ⚖️ License and Public Data
          
          The data is **public domain** and maintained by the Brazilian Ministry of Health.
          This repository only facilitates access to the official files.
          
          ---
          
          <div align="center">
          
          EOF
          
          echo "**🤖 Automatically updated** | Last run: $LAST_UPDATE" >> README.md
          echo "" >> README.md
          echo "</div>" >> README.md
      
      - name: Generate monthly diff reports
        run: python3 scripts/generate_diff_reports.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Sync with remote first
          git fetch origin main
          git reset --soft origin/main
          
          git add -A
          
          if ! git diff --staged --quiet; then
            CHANGES=$(git diff --staged --name-status | head -10)
            
            git commit -m "🔄 Automatic update - $(date -u '+%Y-%m-%d %H:%M')" \
                       -m "Changes:" \
                       -m "$CHANGES"
            
            # Push with retry in case of conflict
            for i in {1..3}; do
              if git push origin HEAD:main; then
                echo "✅ Changes pushed successfully"
                break
              else
                echo "⚠️  Attempt $i failed, syncing..."
                git fetch origin main
                git rebase origin/main
                sleep 2
              fi
            done
          else
            echo "ℹ️  No changes detected"
          fi
